<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <div class="grid grid-cols-1 lg:grid-cols-12 min-h-screen">
            <div class="hidden lg:block col-span-6 bg-[url(/img/login-img.png)] bg-cover"></div>
            <div class="col-span-1 lg:col-span-6">
                <div class="w-full p-[20px] h-full">
                    <div class="flex justify-between text-sm">
                        <p class="underline"><a href="index.html">Back</a></p>
                        <p>New here? <span class="underline font-semibold"><a href="#">Create Account</a></span></p>
                    </div>
                    <div class="flex flex-col gap-10 py-10 px-6 xl:px-24 justify-center h-full">
                        <h1 class="text-4xl lg:text-5xl font-bold text-center lg:text-start">Welcome Back</h1>
                        <p class="text-lg lg:text-xl text-zinc-500 text-center lg:text-start">Sign in to continue
                            Shopping.</p>
                        <div class="flex flex-col gap-2">
                            <div class="flex flex-col gap-2">
                                <h2>Email</h2>
                                <div class="relative">
                                    <input type="email" placeholder="Enter your email"
                                        class="w-full h-12 rounded-lg px-12 border-zinc-300">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="1.5" stroke="currentColor"
                                        class="size-6 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                                    </svg>
                                </div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <h2>Password</h2>
                                <div class="relative">
                                    <input type="password" placeholder="Enter your password"
                                        class="w-full h-12 rounded-lg px-12 border-zinc-300">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="1.5" stroke="currentColor"
                                        class="size-6 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                                    </svg>
                                </div>


                            </div>
                        </div>
                        <div class="flex justify-between">
                            <div class="flex gap-2">
                                <input type="checkbox">
                                <p>Remember me</p>
                            </div>
                            <div>
                                <a href="#">
                                    <p class="underline">Forgot password?</p>
                                </a>
                            </div>
                        </div>
                        <button class="btn btn-neutral rounded-lg">Sign In</button>
                        <div class="flex gap-4 items-center">
                            <div class="flex-1 h-[1px] bg-zinc-300"></div>
                            <p class="text-center">or continue with</p>
                            <div class="flex-1 h-[1px] bg-zinc-300"></div>
                        </div>
                        <div class="flex gap-5 justify-center">
                            <button class="flex-1 btn btn-lg bg-white text-black border-[#e5e5e5]">
                                <svg aria-label="Google logo" width="30" height="30" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 512 512">
                                    <g>
                                        <path d="m0 0H512V512H0" fill="#fff"></path>
                                        <path fill="#34a853" d="M153 292c30 82 118 95 171 60h62v48A192 192 0 0190 341">
                                        </path>
                                        <path fill="#4285f4" d="m386 400a140 175 0 0053-179H260v74h102q-7 37-38 57">
                                        </path>
                                        <path fill="#fbbc02" d="m90 341a208 200 0 010-171l63 49q-12 37 0 73"></path>
                                        <path fill="#ea4335"
                                            d="m153 219c22-69 116-109 179-50l55-54c-78-75-230-72-297 55"></path>
                                    </g>
                                </svg>
                                Google
                            </button>
                            <button class="flex-1 btn btn-lg bg-[#1A77F2] text-white border-[#005fd8]">
                                <svg aria-label="Facebook logo" width="25" height="25"
                                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                                    <path fill="white"
                                        d="M8 12h5V8c0-6 4-7 11-6v5c-4 0-5 0-5 3v2h5l-1 6h-4v12h-6V18H8z"></path>
                                </svg>
                                Facebook
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
